services:
  # Main Full-Stack Web Service (Node.js API + Static React Frontend)
  - type: web
    name: logicore-app
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: logicore-db
          property: connectionString

databases:
  # Managed PostgreSQL Database Instance
  - name: logicore-db
    plan: free
    databaseName: logicore
    user: logicore_user
